<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F3A93">
<title>Camnemi TOPIK App</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">

  <!-- App header -->
  <header class="app-header">
    <a class="brand" href="index.html"><span class="logo">C</span><span>Camnemi TOPIK</span></a>
    <div class="spacer"></div>
    <span id="app-h-sub" style="font-size:12px;color:var(--muted);font-weight:600;"></span>
  </header>

  <!-- Screen container -->
  <main class="app-content" id="screen"></main>

  <!-- Bottom tab bar (standard mobile pattern) -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="home" onclick="go('home')">
      <span class="tab-ico">🏠</span><span>Home</span>
    </button>
    <button class="tab-item" data-tab="daily" onclick="go('daily')">
      <span class="tab-ico">📅</span><span>Daily 10</span>
    </button>
    <button class="tab-item" data-tab="mock" onclick="go('mock')">
      <span class="tab-ico">📝</span><span>Mock Test</span>
    </button>
    <button class="tab-item" data-tab="wrong" onclick="go('wrong')">
      <span class="tab-ico">📓</span><span>My Notes</span>
    </button>
    <button class="tab-item" data-tab="learn" onclick="go('learn')">
      <span class="tab-ico">📚</span><span>Learn</span>
    </button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="data/topik1-bank.js"></script>
<script src="data/topik2-bank.js"></script>
<script src="data/mock-tests.js"></script>
<script src="data/topik-schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
