<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<title>Camnemi TOPIK App</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">

  <!-- App header (iOS large title) -->
  <header class="app-header">
    <a class="brand" href="index.html"><span class="logo">C</span><span>Camnemi TOPIK</span></a>
    <div class="spacer"></div>
    <select id="lang-sel" onchange="setLang(this.value)" title="Language / 언어 / ភាសា"
      style="border:none;background:var(--ios-fill);border-radius:8px;padding:4px 6px;font-size:12px;font-weight:700;color:var(--ios-blue);font-family:var(--ios-font);">
      <option value="en">EN</option>
      <option value="ko">한국어</option>
      <option value="km">ខ្មែរ</option>
    </select>
    <span id="app-h-sub" style="font-size:14px;color:var(--ios-secondary-label);font-weight:700;"></span>
  </header>

  <!-- Screen container -->
  <main class="app-content" id="screen"></main>

  <!-- Bottom tab bar (standard mobile pattern) -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="home" onclick="go('home')">
      <span class="tab-ico">🏠</span><span data-nav-label="home">Home</span>
    </button>
    <button class="tab-item" data-tab="daily" onclick="go('daily')">
      <span class="tab-ico">📅</span><span data-nav-label="daily">Daily 10</span>
    </button>
    <button class="tab-item" data-tab="mock" onclick="go('mock')">
      <span class="tab-ico">📝</span><span data-nav-label="mock">Mock Test</span>
    </button>
    <button class="tab-item" data-tab="wrong" onclick="go('wrong')">
      <span class="tab-ico">📓</span><span data-nav-label="notes">My Notes</span>
    </button>
    <button class="tab-item" data-tab="learn" onclick="go('learn')">
      <span class="tab-ico">📚</span><span data-nav-label="learn">Learn</span>
    </button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="data/topik1-bank.js"></script>
<script src="data/topik2-bank.js"></script>
<script src="data/mock-tests.js"></script>
<script src="data/topik-schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
