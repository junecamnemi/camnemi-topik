<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#007AFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Camnemi TOPIK">
<title>Camnemi TOPIK App</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">

  <!-- App header (iOS large title) -->
  <header class="app-header">
    <a class="brand" href="index.html"><span class="logo"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9 12 4l10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/></svg></span><span>Camnemi TOPIK</span></a>
    <div class="spacer"></div>
    <div class="h-actions">
      <select id="country-sel" onchange="setCountry(this.value)" title="Country / 나라 / ប្រទេស" class="h-chip h-country"></select>
      <button id="theme-btn" onclick="cycleTheme()" title="Theme / 테마 / របៀប" class="h-chip h-btn"></button>
      <select id="lang-sel" onchange="setLang(this.value)" title="Language / 언어 / ភាសា" class="h-chip h-lang">
        <option value="en">EN</option>
        <option value="ko">한국어</option>
        <option value="km">ខ្មែរ</option>
      </select>
    </div>
  </header>

  <!-- Country D-day strip (auto-rotates when multiple sessions) -->
  <div id="dday-strip" class="dday-strip" onclick="go('schedule')"></div>

  <!-- Screen container -->
  <main class="app-content" id="screen"></main>

  <!-- Bottom tab bar (standard mobile pattern) -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="home" onclick="go('home')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span><span data-nav-label="home">Home</span>
    </button>
    <button class="tab-item" data-tab="daily" onclick="go('daily')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg></span><span data-nav-label="daily">Daily 10</span>
    </button>
    <button class="tab-item" data-tab="mock" onclick="go('mock')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6M9 4c0-1 .5-2 1.5-2h3C14.5 2 15 3 15 4"/><path d="M9 10h6M9 14h6M9 18h3"/></svg></span><span data-nav-label="mock">Mock Test</span>
    </button>
    <button class="tab-item" data-tab="wrong" onclick="go('wrong')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6c-1.5-1.2-3.5-2-6-2H3v15h3c2.5 0 4.5.8 6 2 1.5-1.2 3.5-2 6-2h3V4h-3c-2.5 0-4.5.8-6 2z"/><path d="M12 6v15"/></svg></span><span data-nav-label="notes">My Notes</span>
    </button>
    <button class="tab-item" data-tab="progress" onclick="go('progress')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg></span><span data-nav-label="progress">Progress</span>
    </button>
    <button class="tab-item" data-tab="learn" onclick="go('learn')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9 12 4l10 5-10 5L2 9z"/><path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/><path d="M22 9v5"/></svg></span><span data-nav-label="learn">Learn</span>
    </button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="data/topik1-bank.js"></script>
<script src="data/topik2-bank.js"></script>
<script src="data/mock-tests.js"></script>
<script src="data/topik-schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
