<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A78BFA">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Camnemi TOPIK">
<title>Camnemi TOPIK App</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css?v=book-2">
<link rel="stylesheet" href="css/book.css?v=book-2">
</head>
<body>
<div class="app-shell">
  <!-- ambient AI gradient backdrop — tinted by the current character's hue -->
  <div class="ai-backdrop" aria-hidden="true"></div>

  <!-- App header (iOS large title) -->
  <header class="app-header">
    <button id="back-btn" class="back-btn" onclick="goBack()" aria-label="Back" style="display:none;">←</button>
    <a class="brand" href="index.html" style="flex-direction:column;align-items:flex-start;gap:0;line-height:1.1;">
      <span style="font-size:15px;font-weight:800;letter-spacing:-.2px;">AI TOPIK Test</span>
      <span style="font-size:9.5px;font-weight:600;opacity:.75;letter-spacing:.3px;">by Camnemi Korea</span>
    </a>
    <div class="spacer"></div>
    <div class="h-actions">
      <span id="sched-banner" onclick="go('schedule')" title="TOPIK 일정" class="h-chip sched-banner"></span>
    </div>
  </header>

  <!-- User menu sheet (account / stats / settings) -->
  <div id="user-menu-overlay" class="menu-overlay" onclick="closeUserMenu()"></div>
  <div id="user-menu" class="user-menu"></div>

  <!-- Character picker sheet -->
  <div id="char-picker-overlay" class="menu-overlay" onclick="closeCharPicker()"></div>
  <div id="char-picker" class="char-picker"></div>

  <!-- Screen container -->
  <main class="app-content" id="screen"></main>

  <!-- Bottom tab bar: Home / Book / TOPIK Test / Rank / My -->
  <nav class="tab-bar">
    <button class="tab-item active" data-tab="home" onclick="go('home')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg></span><span data-nav-label="home">Home</span>
    </button>
    <button class="tab-item" data-tab="book" onclick="go('book')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></span><span data-nav-label="book">Book</span>
    </button>
    <button class="tab-item" data-tab="daily" onclick="go('daily')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6V3M16 6V3M3 10h18"/><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M9 15l2 2 4-4"/></svg></span><span data-nav-label="daily">TOPIK Test</span>
    </button>
    <button class="tab-item" data-tab="rank" onclick="go('rank')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3"/></svg></span><span data-nav-label="rank">Rank</span>
    </button>
    <button class="tab-item" data-tab="my" onclick="go('my')">
      <span class="tab-ico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span><span data-nav-label="my">설정</span>
    </button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/common.js?v=book-2"></script>
<script src="js/auth.js?v=book-2"></script>
<script src="data/topik1-bank.js"></script>
<script src="data/topik2-bank.js"></script>
<script src="data/level1-bank.js"></script>
<script src="data/level2-bank.js"></script>
<script src="data/level3-bank.js"></script>
<script src="data/level4-bank.js"></script>
<script src="data/level5-bank.js"></script>
<script src="data/level6-bank.js"></script>
<script src="data/mock-tests.js"></script>
<script src="data/level-test.js"></script>
<script src="data/vocab-bank.js"></script>
<script src="data/topik-schedule.js"></script>
<script src="data/glowsis-book.js?v=book-2"></script>
<script src="js/chars.js?v=book-2"></script>
<script src="js/app.js?v=book-2"></script>
<script src="js/glowsis-view.js?v=book-2"></script>
</body>
</html>
