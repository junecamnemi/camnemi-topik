<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7C3AED">
<title>AI TOPIK Practice with K-POP IDOL</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* ============ K-POP IDOL login: idol-game stage backdrop ============ */
  html,body { margin:0; }
  body { font-family: var(--ios-font, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif); min-height:100vh; }

  /* Full-screen idol-stage backdrop, visible */
  .stage-bg { position:fixed; inset:0; z-index:-2; background:#241a44; }
  .stage-bg img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 30%; }
  .stage-bg::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(30,20,54,.78) 0%, rgba(30,20,54,.25) 38%, rgba(30,20,54,.62) 100%); }

  /* Layout */
  .auth-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:36px 20px; box-sizing:border-box; position:relative; }

  /* Whole-screen hero title */
  .hero-title { text-align:center; color:#fff; margin-bottom:26px; max-width:600px; }
  .hero-title .eyebrow { font-size:11.5px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:#e9d5ff; opacity:.95; margin-bottom:12px; }
  .hero-title h1 { font-size:clamp(26px, 5.2vw, 46px); font-weight:900; letter-spacing:-1px; line-height:1.12; margin:0;
    background:linear-gradient(135deg,#fff 10%,#e9d5ff 45%,#f9a8d4 90%); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; text-shadow:0 8px 40px rgba(0,0,0,.5); }
  .hero-title p { font-size:14px; font-weight:600; color:#e6dcff; margin:13px 0 0; opacity:.95; }

  /* Compact auth card — social login only */
  .auth-card {
    width:100%; max-width:360px;
    background:rgba(28,19,50,.78); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(233,213,255,.22); border-radius:22px;
    padding:22px 22px 20px; box-shadow:0 22px 55px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;
  }
  .auth-card .auth-hint { font-size:12.5px; font-weight:600; color:#cdbfee; margin:0 0 16px; }
  .auth-card .divider-mini { display:flex; align-items:center; gap:10px; color:#8f7fb8; font-size:11px; font-weight:700; margin:16px 0 18px; text-transform:uppercase; letter-spacing:.5px; }
  .auth-card .divider-mini::before,.auth-card .divider-mini::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(233,213,255,.2),rgba(233,213,255,.2),transparent); }

  .oauth-btn { display:flex; align-items:center; justify-content:center; gap:11px; width:100%;
    padding:12px 16px; margin-bottom:11px; border-radius:14px; font-size:14.5px; font-weight:700;
    cursor:pointer; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06); color:#f3efff;
    transition:transform .14s ease, background .14s ease; }
  .oauth-btn:hover { transform:translateY(-1px); background:rgba(255,255,255,.12); }
  .oauth-btn svg { width:19px; height:19px; flex:none; }
  .oauth-btn.facebook { background:linear-gradient(135deg,#1877F2,#1466D6); color:#fff; border-color:transparent; }
  .oauth-btn.facebook:hover { background:linear-gradient(135deg,#2a86ff,#1466D6); }

  .welcome-banner { background:rgba(167,139,250,.16); border:1px solid rgba(167,139,250,.4); color:#e9d5ff; border-radius:12px; padding:11px 16px; margin-bottom:14px; font-size:14px; font-weight:600; }

  /* Bottom — AI TOPIK START gradient button into the app */
  .start-area { margin-top:22px; width:100%; max-width:360px; text-align:center; }
  .start-btn {
    width:100%; padding:16px; border:none; border-radius:18px; font-size:17px; font-weight:900; letter-spacing:.5px;
    cursor:pointer; color:#fff;
    background:linear-gradient(135deg,#7C3AED 0%,#A78BFA 30%,#EC4899 70%,#F59E0B 100%);
    background-size:220% 220%; animation:gradShift 6s ease infinite;
    box-shadow:0 10px 30px rgba(236,72,153,.45), 0 4px 14px rgba(124,58,237,.4);
    transition:transform .15s ease;
  }
  .start-btn:hover { transform:translateY(-2px); box-shadow:0 14px 40px rgba(236,72,153,.55), 0 6px 20px rgba(124,58,237,.5); }
  .start-btn:active { transform:translateY(0); }
  .start-btn small { display:block; font-size:11px; font-weight:600; letter-spacing:1.5px; opacity:.9; margin-top:3px; }
  @keyframes gradShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
  .start-hint { font-size:12px; color:#c2b4e6; margin-top:11px; font-weight:500; }

  @media (max-width:480px) {
    .auth-wrap { padding:26px 18px; justify-content:flex-start; }
    .hero-title { margin-bottom:22px; }
    .hero-title h1 { font-size:28px; }
    .auth-card { padding:20px 18px 18px; border-radius:20px; }
  }
</style>
</head>
<body>

<!-- Idol-game stage backdrop -->
<div class="stage-bg"><img src="assets/glowsis/login-bg.webp" alt="" draggable="false"></div>

<div class="auth-wrap">
  <!-- Whole-screen hero title -->
  <div class="hero-title">
    <div class="eyebrow">★ Glowsis · AI TOPIK ★</div>
    <h1>AI TOPIK Practice<br>with K-POP IDOL</h1>
    <p>Learn Korean with your favorite idols — save progress, keep your streak alive.</p>
  </div>

  <!-- Compact social login -->
  <div class="auth-card">
    <p class="auth-hint">Sign in to save your progress</p>
    <div id="auth-status"></div>
    <button class="oauth-btn google" onclick="loginWith('google')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn facebook" onclick="loginWith('facebook')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.026 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
      Continue with Facebook
    </button>
    <div class="divider-mini">or just explore</div>
  </div>

  <!-- AI TOPIK START — straight into the app -->
  <div class="start-area">
    <button class="start-btn" onclick="goBrowse()">
      AI TOPIK START
      <small>둘러보기 · Browse for free</small>
    </button>
    <p class="start-hint">Explore the app freely — sign in anytime to save progress.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  function goBrowse() { window.location.href = 'app.html'; }

  // OAuth callback handling
  (async function () {
    if (!window.initAuth) return;
    await initAuth();
    const hash = window.location.hash;
    if (hash && (hash.includes('access_token') || hash.includes('error'))) { return handleAuthCallback(); }
    const s = getSession();
    if (s) {
      document.getElementById('auth-status').innerHTML =
        '<div class="welcome-banner">✓ You are logged in. Redirecting…</div>';
      setTimeout(()=>{ window.location.href='app.html?welcome=1'; }, 700);
    }
  })();
</script>
</body>
</html>
