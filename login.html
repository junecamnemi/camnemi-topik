<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7C3AED">
<title>AI TOPIK Practice with K-POP IDOL</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<style>
  /* ============ K-POP IDOL login: idol-game stage backdrop ============ */
  html,body { margin:0; }
  body { font-family: var(--ios-font, -apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif); min-height:100vh; }

  /* Full-screen idol-stage backdrop, visible */
  .stage-bg { position:fixed; inset:0; z-index:-2; background:#241a44; }
  .stage-bg video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  .stage-bg::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(30,20,54,.78) 0%, rgba(30,20,54,.22) 38%, rgba(30,20,54,.62) 100%); }

  /* Layout — content docked to the bottom; uses a spacer so content never
     overflows up under the fixed title (it scrolls instead of overlapping). */
  .auth-wrap { min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:110px 20px max(20px, env(safe-area-inset-bottom)); box-sizing:border-box; position:relative; }
  .auth-wrap .spacer { flex:1 1 auto; min-height:0; }

  /* Whole-screen hero title — pinned to the top so the idol art stays visible */
  .hero-title { position:fixed; top:0; left:0; right:0; z-index:5; text-align:center; color:#fff;
    padding:max(30px, env(safe-area-inset-top)) 20px 16px; max-width:none; pointer-events:none;
    background:linear-gradient(180deg, rgba(30,20,54,.85), rgba(30,20,54,.35) 70%, transparent); }
  .hero-title .eyebrow { font-size:11.5px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:#e9d5ff; opacity:.95; margin-bottom:10px; }
  .hero-title h1 { font-size:clamp(26px, 5.2vw, 44px); font-weight:900; letter-spacing:-1px; line-height:1.1; margin:0;
    background:linear-gradient(135deg,#fff 10%,#e9d5ff 45%,#f9a8d4 90%); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; text-shadow:0 8px 40px rgba(0,0,0,.5); }
  .hero-title p { font-size:13.5px; font-weight:600; color:#e6dcff; margin:11px 0 0; opacity:.95; }

  /* Compact auth card — social login only */
  .auth-card {
    width:100%; max-width:360px;
    background:rgba(24,16,44,.42); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(233,213,255,.16); border-radius:22px;
    padding:22px 22px 20px; box-shadow:0 22px 55px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05);
    text-align:center;
  }
  .auth-card .auth-hint { font-size:12.5px; font-weight:600; color:#d9cdf3; margin:0 0 16px; }
  .auth-card .divider-mini { display:flex; align-items:center; gap:10px; color:#a494c9; font-size:11px; font-weight:700; margin:16px 0 18px; text-transform:uppercase; letter-spacing:.5px; }
  .auth-card .divider-mini::before,.auth-card .divider-mini::after { content:''; flex:1; height:1px; background:linear-gradient(90deg,transparent,rgba(233,213,255,.18),rgba(233,213,255,.18),transparent); }

  .oauth-btn { display:flex; align-items:center; justify-content:center; gap:11px; width:100%;
    padding:12px 16px; margin-bottom:11px; border-radius:14px; font-size:14.5px; font-weight:700;
    cursor:pointer; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.08); color:#f6f2ff;
    transition:transform .14s ease, background .14s ease; }
  .oauth-btn:hover { transform:translateY(-1px); background:rgba(255,255,255,.14); }
  .oauth-btn svg { width:19px; height:19px; flex:none; }
  .oauth-btn.google { background:rgba(255,255,255,.09); }
  .oauth-btn.facebook { background:rgba(24,119,242,.22); color:#fff; border-color:rgba(255,255,255,.18); }
  .oauth-btn.facebook:hover { background:rgba(24,119,242,.32); }

  /* Email sign-up / sign-in (with email verification) */
  .ea-tabs { display:flex; gap:6px; background:rgba(255,255,255,.07); border-radius:12px; padding:4px; margin-bottom:14px; }
  .ea-tab { flex:1; border:none; background:transparent; color:#cbbcf0; font-weight:800; font-size:13.5px;
    padding:9px 0; border-radius:9px; cursor:pointer; font-family:inherit; }
  .ea-tab.active { background:linear-gradient(135deg,#7C3AED,#EC4899); color:#fff; }
  .ea-input { width:100%; box-sizing:border-box; margin-bottom:10px; padding:12px 14px; border-radius:13px;
    border:1px solid rgba(233,213,255,.2); background:rgba(255,255,255,.08); color:#fff; font-size:14.5px;
    font-family:inherit; outline:none; }
  .ea-input::placeholder { color:#b8a9dc; }
  .ea-input:focus { border-color:#A78BFA; background:rgba(255,255,255,.13); }
  .ea-submit { width:100%; padding:13px 16px; border:none; border-radius:14px; cursor:pointer; color:#fff;
    font-size:15px; font-weight:900; font-family:inherit;
    background:linear-gradient(135deg,#7C3AED,#EC4899); box-shadow:0 8px 22px rgba(124,58,237,.4); }
  .ea-submit:disabled { opacity:.6; cursor:default; }
  .ea-msg { margin-top:11px; font-size:12.5px; font-weight:700; line-height:1.5; border-radius:11px; padding:0; }
  .ea-msg.show { padding:10px 12px; }
  .ea-msg.ok { background:rgba(52,211,153,.16); border:1px solid rgba(52,211,153,.45); color:#a7f3d0; }
  .ea-msg.err { background:rgba(248,113,113,.16); border:1px solid rgba(248,113,113,.45); color:#fecaca; }

  .welcome-banner { background:rgba(167,139,250,.16); border:1px solid rgba(167,139,250,.4); color:#e9d5ff; border-radius:12px; padding:11px 16px; margin-bottom:14px; font-size:14px; font-weight:600; }

  /* Bottom — AI TOPIK START gradient bar (one horizontal line, full width) */
  .start-area { margin-top:18px; width:100%; max-width:420px; text-align:center; }
  .start-btn {
    width:100%; padding:15px 18px; border:none; border-radius:18px; cursor:pointer; color:#fff;
    display:flex; align-items:center; justify-content:center; gap:11px;
    background:linear-gradient(135deg,#7C3AED 0%,#A78BFA 30%,#EC4899 70%,#F59E0B 100%);
    background-size:220% 220%; animation:gradShift 6s ease infinite;
    box-shadow:0 10px 30px rgba(236,72,153,.45), 0 4px 14px rgba(124,58,237,.4);
    transition:transform .15s ease;
  }
  .start-btn .ai-ico { flex:none; filter:drop-shadow(0 2px 8px rgba(0,0,0,.35)); display:flex; align-items:center; }
  .start-btn .ai-ico svg { display:block; width:22px; height:22px; opacity:.6;
    animation:starTwinkle 3.2s ease-in-out infinite; }
  @keyframes starTwinkle { 0%,100%{opacity:.25; transform:scale(.9);} 50%{opacity:.85; transform:scale(1.12);} }
  .start-btn .lbl { display:flex; align-items:baseline; gap:8px; line-height:1; }
  .start-btn .lbl b { font-size:17px; font-weight:900; letter-spacing:.5px; }
  .start-btn .lbl span { font-size:11px; font-weight:700; letter-spacing:1px; opacity:.9; }
  @keyframes gradShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }

  /* copyright */
  .copyright { margin-top:14px; font-size:12px; font-weight:600; color:#c2b4e6; letter-spacing:.3px; }

  @media (max-width:480px) {
    .auth-wrap { padding:96px 18px max(20px, env(safe-area-inset-bottom)); }
    .hero-title { padding:max(26px, env(safe-area-inset-top)) 16px 14px; }
    .hero-title h1 { font-size:28px; }
    .hero-title p { font-size:12.5px; }
    .auth-card { padding:20px 18px 18px; border-radius:20px; }
    .start-btn .lbl span { display:none; }
  }
</style>
</head>
<body>

<!-- Idol-stage animated backdrop (school-uniform Glowsis singing on stage) -->
<div class="stage-bg">
  <video autoplay muted loop playsinline preload="auto" aria-hidden="true">
    <source src="assets/home_bg/glowsis_stage_anime.mp4" type="video/mp4">
  </video>
</div>

<div class="auth-wrap">
  <!-- Whole-screen hero title — pinned to top -->
  <div class="hero-title">
    <div class="eyebrow">★ Glowsis · AI TOPIK ★</div>
    <h1>AI TOPIK Practice<br>with K-POP IDOL</h1>
    <p>Learn Korean with your favorite idols — save progress, keep your streak alive.</p>
  </div>

  <div class="spacer"></div>

  <!-- Compact auth: email sign-up/sign-in + social -->
  <div class="auth-card">
    <p class="auth-hint">Sign in to save your progress</p>
    <div id="auth-status"></div>

    <!-- Email (with verification) -->
    <div class="email-auth">
      <div class="ea-tabs">
        <button class="ea-tab active" id="ea-tab-login" onclick="eaSetMode('login')">Log in</button>
        <button class="ea-tab" id="ea-tab-signup" onclick="eaSetMode('signup')">Sign up</button>
      </div>
      <input class="ea-input" id="ea-name" type="text" placeholder="Name (이름)" autocomplete="name" style="display:none;">
      <input class="ea-input" id="ea-email" type="email" placeholder="Email" autocomplete="email">
      <input class="ea-input" id="ea-pw" type="password" placeholder="Password (6+ chars)" autocomplete="current-password">
      <button class="ea-submit" id="ea-submit" onclick="eaSubmit()">Log in</button>
      <div class="ea-msg" id="ea-msg"></div>
    </div>

    <div class="divider-mini">or continue with</div>
    <button class="oauth-btn google" onclick="loginWith('google')">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Continue with Google
    </button>
    <button class="oauth-btn facebook" onclick="loginWith('facebook')">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073C24 5.405 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047v-2.66c0-3.026 1.792-4.697 4.533-4.697 1.312 0 2.686.235 2.686.235v2.971H15.83c-1.491 0-1.956.93-1.956 1.886v2.265h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/></svg>
      Continue with Facebook
    </button>
    <div class="divider-mini">or just explore</div>
  </div>

  <!-- AI TOPIK START — one horizontal line, full width -->
  <div class="start-area">
    <button class="start-btn" onclick="goBrowse()">
      <span class="ai-ico">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/></svg>
      </span>
      <span class="lbl"><b>AI TOPIK START</b><span>둘러보기 · Browse for free</span></span>
    </button>
  </div>

  <p class="copyright">© by Camnemi Korea</p>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js?v=emailauth1"></script>
<script>
  function goBrowse() { window.location.href = 'app.html'; }

  /* ---- Email sign-up / sign-in with verification ---- */
  let eaMode = 'login';
  function eaSetMode(m) {
    eaMode = m;
    document.getElementById('ea-tab-login').classList.toggle('active', m === 'login');
    document.getElementById('ea-tab-signup').classList.toggle('active', m === 'signup');
    document.getElementById('ea-name').style.display = (m === 'signup') ? 'block' : 'none';
    document.getElementById('ea-submit').textContent = (m === 'signup') ? 'Sign up' : 'Log in';
    eaMsg('');
  }
  function eaMsg(text, kind) {
    const el = document.getElementById('ea-msg');
    if (!text) { el.className = 'ea-msg'; el.textContent = ''; return; }
    el.className = 'ea-msg show ' + (kind || 'ok');
    el.innerHTML = text;
  }
  async function eaSubmit() {
    const email = (document.getElementById('ea-email').value || '').trim();
    const pw = document.getElementById('ea-pw').value || '';
    const name = (document.getElementById('ea-name').value || '').trim();
    if (!email || !pw) { eaMsg('이메일과 비밀번호를 입력하세요.', 'err'); return; }
    if (eaMode === 'signup' && pw.length < 6) { eaMsg('비밀번호는 6자 이상이어야 합니다.', 'err'); return; }
    const btn = document.getElementById('ea-submit');
    btn.disabled = true;
    eaMsg(eaMode === 'signup' ? '가입 중…' : '로그인 중…', 'ok');
    try {
      if (eaMode === 'signup') {
        const r = await emailSignup(email, pw, name);
        if (!r.ok) { eaMsg('가입 실패: ' + r.msg, 'err'); }
        else if (r.confirm) {
          eaMsg('✅ 인증 메일을 보냈어요!<br>' + email + ' 받은편지함에서 <b>인증 링크</b>를 눌러 가입을 완료하세요.<br><span style="opacity:.8">(스팸함도 확인해 주세요)</span>', 'ok');
        } else {
          window.location.href = 'app.html?welcome=1';
        }
      } else {
        const r = await emailLogin(email, pw);
        if (!r.ok) { eaMsg('로그인 실패: ' + r.msg, 'err'); }
        else { window.location.href = 'app.html?welcome=1'; }
      }
    } catch (e) { eaMsg('오류: ' + (e && e.message ? e.message : e), 'err'); }
    btn.disabled = false;
  }
  // Enter key submits
  ['ea-name','ea-email','ea-pw'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('keydown', e => { if (e.key === 'Enter') eaSubmit(); });
  });

  // OAuth callback + verified banner + already-logged-in handling
  (async function () {
    if (!window.initAuth) return;
    await initAuth();
    const hash = window.location.hash;
    if (hash && (hash.includes('access_token') || hash.includes('error'))) { return handleAuthCallback(); }
    if (/[?&]verified=1/.test(location.search)) {
      const s = getSession();
      if (s) {
        document.getElementById('auth-status').innerHTML =
          '<div class="welcome-banner">✓ 인증 완료! 로그인되었습니다. 이동 중…</div>';
        setTimeout(()=>{ window.location.href='app.html?welcome=1'; }, 900);
        return;
      }
      eaMsg('이메일 인증이 완료됐어요. 이제 로그인하세요.', 'ok');
    }
    const s = getSession();
    if (s) {
      document.getElementById('auth-status').innerHTML =
        '<div class="welcome-banner">✓ You are logged in. Redirecting…</div>';
      setTimeout(()=>{ window.location.href='app.html?welcome=1'; }, 700);
    }
  })();
</script>
</body>
</html>
