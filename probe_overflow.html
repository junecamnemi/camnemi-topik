<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"></head>
<body><iframe id="f" src="textbook/1a.html" style="width:412px;height:900px;border:none"></iframe>
<script>
setTimeout(function(){
 try{
  var d=f.contentDocument, w=f.contentWindow;
  var out=[];
  out.push('scrollW='+d.documentElement.scrollWidth+' clientW='+d.documentElement.clientWidth);
  // 가로 넘치는 요소 찾기
  var els=d.querySelectorAll('*'); var over=[];
  for(var i=0;i<els.length;i++){var e=els[i];var r=e.getBoundingClientRect();if(r.right>d.documentElement.clientWidth+2||r.left<-2){var c=e.className||e.tagName;if(typeof c==='string'&&over.length<8)over.push(c+'(w'+Math.round(r.width)+',r'+Math.round(r.right)+')');}}
  out.push('overflow='+over.join(','));
  document.title='DIAG|'+out.join(' || ');
 }catch(e){document.title='ERR'+e.message;}
},3000);
</script></body></html>
