<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — DAWN: the sun slowly rises over the ridge -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E8CC8"/>
      <stop offset="0.5" stop-color="#E4B7D8"/>
      <stop offset="0.78" stop-color="#FFD9B0"/>
      <stop offset="1" stop-color="#FFE9CC"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- sunrise sun — slowly climbs from behind the ridge -->
  <g>
    <circle cx="560" cy="330" r="46" fill="#FFC98A" opacity="0.55">
      <animate attributeName="cy" values="330;205" dur="9s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="330" r="30" fill="#FFDFA6" opacity="0.9">
      <animate attributeName="cy" values="330;205" dur="9s" calcMode="spline" keySplines="0.4 0 0.2 1" repeatCount="indefinite"/>
    </circle>
    <!-- sun rays appear as it rises -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.7" dur="9s" keyTimes="0;0.5;1" repeatCount="indefinite"/>
      <path d="M560 150 l0 -26 M560 150 l-18 -18 M560 150 l18 -18" stroke="#FFD9A0" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- morning mist bands -->
  <g fill="#FFFFFF" opacity="0.22">
    <ellipse cx="260" cy="238" rx="220" ry="12"/>
    <ellipse cx="650" cy="250" rx="250" ry="10" opacity="0.8"/>
  </g>

  <!-- far hills (cool lavender) -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#9A8CC8" opacity="0.6"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#7C6FAE" opacity="0.85"/>

  <!-- trees -->
  <g fill="#6C5FA0" opacity="0.9">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- N Seoul Tower silhouette with soft warm lights -->
  <g>
    <path d="M548 262 L560 232 L572 262Z" fill="#5E528C" opacity="0.95"/>
    <rect x="540" y="220" width="40" height="14" rx="6" fill="#8A7FBE"/>
    <rect x="552" y="208" width="16" height="12" rx="3" fill="#A79CBE"/>
    <path d="M552 208 L560 172 L568 208Z" fill="#6E639C"/>
    <line x1="560" y1="172" x2="560" y2="140" stroke="#5E528C" stroke-width="3" stroke-linecap="round"/>
    <!-- deck lights slowly warm up -->
    <circle cx="546" cy="226" r="1.7" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.4;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="554" cy="227" r="1.5" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.4;1" dur="2.6s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="562" cy="226" r="1.7" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.4;1" dur="3.4s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="227" r="1.5" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.4;1" dur="2.8s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="139" r="2.4" fill="#FFB3C1"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sleepy birds -->
  <g stroke="#5A4E8C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M300 200 q7 -5 14 0 q7 -5 14 0">
      <animateMotion dur="26s" repeatCount="indefinite" path="M0,0 C60,-26 120,-26 200,-2 C-40,-16 -120,-10 -260,6"/>
    </path>
    <path d="M330 216 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="32s" begin="-10s" repeatCount="indefinite" path="M0,0 C70,-20 140,-20 220,-6 C-50,-12 -140,-6 -280,8"/>
    </path>
  </g>
</svg>
