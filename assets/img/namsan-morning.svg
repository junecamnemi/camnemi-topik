<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — MORNING (09-12): fresh clear morning, sun up east -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FC3F0"/>
      <stop offset="0.55" stop-color="#C9E8FF"/>
      <stop offset="1" stop-color="#F3F9E8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- morning sun (east/left, still low-ish) -->
  <circle cx="240" cy="120" r="30" fill="#FFE8A0"/>
  <circle cx="240" cy="120" r="48" fill="#FFE8A0" opacity="0.22"/>
  <g opacity="0.5">
    <path d="M240 58 l0 -20 M240 58 l-14 -14 M240 58 l14 -14 M198 86 l-16 -8 M282 86 l16 -8" stroke="#FFE8A0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- fresh small clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="560" cy="80" rx="46" ry="14"><animate attributeName="cx" values="560;600;560" dur="50s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="740" cy="120" rx="40" ry="12" opacity="0.7"><animate attributeName="cx" values="740;700;740" dur="60s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="140" cy="170" rx="36" ry="10" opacity="0.6"><animate attributeName="cx" values="140;180;140" dur="55s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- far hills (light blue) -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#9DBBE8" opacity="0.6"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#7E9CD6" opacity="0.8"/>

  <!-- trees -->
  <g fill="#6B8AC4" opacity="0.9">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- N Seoul Tower -->
  <g>
    <path d="M548 262 L560 232 L572 262Z" fill="#7E95C9"/>
    <rect x="540" y="220" width="40" height="14" rx="6" fill="#B8C8E8"/>
    <rect x="552" y="208" width="16" height="12" rx="3" fill="#CBD8F0"/>
    <path d="M552 208 L560 172 L568 208Z" fill="#93AADB"/>
    <line x1="560" y1="172" x2="560" y2="140" stroke="#6B84BC" stroke-width="3" stroke-linecap="round"/>
    <line x1="557" y1="166" x2="563" y2="166" stroke="#6B84BC" stroke-width="2"/>
  </g>

  <!-- lively birds -->
  <g stroke="#4E679C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M320 190 q7 -5 14 0 q7 -5 14 0">
      <animateMotion dur="13s" repeatCount="indefinite" path="M0,0 C60,-26 120,-26 200,-2 C-40,-16 -120,-10 -260,6"/>
    </path>
    <path d="M350 208 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="17s" begin="-5s" repeatCount="indefinite" path="M0,0 C70,-20 140,-20 220,-6 C-50,-12 -140,-6 -280,8"/>
    </path>
    <path d="M420 180 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="20s" begin="-9s" repeatCount="indefinite" path="M0,0 C80,-18 150,-18 240,-4 C-60,-10 -160,-4 -300,10"/>
    </path>
  </g>
</svg>
