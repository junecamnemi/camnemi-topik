<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — SUNSET/DUSK: warm golden hour glow -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7FB8"/>
      <stop offset="0.4" stop-color="#C78FC4"/>
      <stop offset="0.68" stop-color="#FFB48F"/>
      <stop offset="1" stop-color="#FFE0B0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- low golden sun -->
  <circle cx="640" cy="222" r="26" fill="#FFD98A" opacity="0.95"/>
  <circle cx="640" cy="222" r="44" fill="#FFCE8A" opacity="0.3"/>
  <circle cx="640" cy="222" r="70" fill="#FFB48F" opacity="0.15"/>

  <!-- warm clouds -->
  <g fill="#FFD9C2" opacity="0.55">
    <ellipse cx="210" cy="120" rx="58" ry="15"><animate attributeName="cx" values="210;270;210" dur="40s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="470" cy="150" rx="44" ry="12" opacity="0.7"><animate attributeName="cx" values="470;410;470" dur="52s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="760" cy="100" rx="50" ry="13"><animate attributeName="cx" values="760;810;760" dur="46s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- far hills (purple haze) -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#8A76B0" opacity="0.75"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#6E5C9A" opacity="0.9"/>

  <!-- trees -->
  <g fill="#5E4E8E" opacity="0.95">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- N Seoul Tower (sunset silhouette, lights just starting) -->
  <g>
    <path d="M548 262 L560 232 L572 262Z" fill="#4E4080" opacity="0.98"/>
    <rect x="540" y="220" width="40" height="14" rx="6" fill="#7A6CA8"/>
    <rect x="552" y="208" width="16" height="12" rx="3" fill="#8E80B4"/>
    <path d="M552 208 L560 172 L568 208Z" fill="#584A8A"/>
    <line x1="560" y1="172" x2="560" y2="140" stroke="#4E4080" stroke-width="3" stroke-linecap="round"/>
    <!-- deck lights glowing warm -->
    <circle cx="546" cy="226" r="1.7" fill="#FFD98A"><animate attributeName="opacity" values="0.3;1;0.5;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="554" cy="227" r="1.5" fill="#FFE9A8"><animate attributeName="opacity" values="0.3;1;0.5;1" dur="2.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="562" cy="226" r="1.7" fill="#FFD98A"><animate attributeName="opacity" values="0.3;1;0.5;1" dur="3.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="570" cy="227" r="1.5" fill="#FFE9A8"><animate attributeName="opacity" values="0.3;1;0.5;1" dur="2.8s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="139" r="2.4" fill="#FFB3C1"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- birds flying home -->
  <g stroke="#4A3C78" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M300 200 q7 -5 14 0 q7 -5 14 0">
      <animateMotion dur="14s" repeatCount="indefinite" path="M0,0 C60,-26 120,-26 200,-2 C-40,-16 -120,-10 -260,6"/>
    </path>
    <path d="M330 216 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="19s" begin="-7s" repeatCount="indefinite" path="M0,0 C70,-20 140,-20 220,-6 C-50,-12 -140,-6 -280,8"/>
    </path>
    <path d="M360 190 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="22s" begin="-3s" repeatCount="indefinite" path="M0,0 C80,-18 150,-18 240,-4 C-60,-10 -160,-4 -300,10"/>
    </path>
  </g>
</svg>
