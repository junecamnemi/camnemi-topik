<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — DAY: bright sunny sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0FF"/>
      <stop offset="0.62" stop-color="#E8F4FF"/>
      <stop offset="1" stop-color="#FFF6E6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- soft sun -->
  <circle cx="712" cy="86" r="34" fill="#FFE28A" opacity="0.95"/>
  <circle cx="712" cy="86" r="52" fill="#FFE28A" opacity="0.25"/>

  <!-- drifting clouds -->
  <g fill="#FFFFFF" opacity="0.8">
    <ellipse cx="190" cy="70" rx="52" ry="17">
      <animate attributeName="cx" values="190;240;190" dur="46s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="110" rx="40" ry="13" opacity="0.7">
      <animate attributeName="cx" values="400;350;400" dur="60s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- far hills -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#9DB5E2" opacity="0.65"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#7E9BD0" opacity="0.85"/>

  <!-- trees -->
  <g fill="#6B8AC4" opacity="0.9">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- N Seoul Tower -->
  <g>
    <path d="M548 262 L560 232 L572 262Z" fill="#7E95C9" opacity="0.95"/>
    <rect x="540" y="220" width="40" height="14" rx="6" fill="#B8C8E8"/>
    <rect x="552" y="208" width="16" height="12" rx="3" fill="#CBD8F0"/>
    <path d="M552 208 L560 172 L568 208Z" fill="#93AADB"/>
    <line x1="560" y1="172" x2="560" y2="140" stroke="#6B84BC" stroke-width="3" stroke-linecap="round"/>
    <line x1="557" y1="166" x2="563" y2="166" stroke="#6B84BC" stroke-width="2"/>
    <line x1="557" y1="158" x2="563" y2="158" stroke="#6B84BC" stroke-width="1.6"/>
  </g>

  <!-- birds -->
  <g stroke="#4E679C" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M300 200 q7 -5 14 0 q7 -5 14 0">
      <animateMotion dur="18s" repeatCount="indefinite" path="M0,0 C60,-26 120,-26 200,-2 C-40,-16 -120,-10 -260,6"/>
    </path>
    <path d="M330 216 q6 -4 12 0 q6 -4 12 0">
      <animateMotion dur="24s" begin="-8s" repeatCount="indefinite" path="M0,0 C70,-20 140,-20 220,-6 C-50,-12 -140,-6 -280,8"/>
    </path>
  </g>
</svg>
