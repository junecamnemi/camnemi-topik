<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
    <!-- ================= N Seoul Tower — REAL silhouette ================= -->
  <g>
    <!-- podium base: wide trapezoid sitting on the hill -->
    <path d="M530 258 L590 258 L596 240 L524 240 Z" fill="#1A1E38" opacity="0.95"/>
    <!-- shaft: narrow vertical trunk rising from the podium -->
    <rect x="554" y="196" width="12" height="46" fill="#1A1E38" opacity="0.95"/>
    <!-- lower maintenance deck (small bump on the shaft) -->
    <rect x="549" y="200" width="22" height="6" rx="2" fill="#1A1E38" opacity="0.9"/>

    <!-- observation deck: the iconic rounded "donut" — wide ellipse -->
    <ellipse cx="560" cy="190" rx="30" ry="9" fill="#1A1E38" opacity="0.95"/>
    <!-- deck upper body (cylindrical) -->
    <rect x="536" y="172" width="48" height="18" rx="8" fill="#1A1E38" opacity="0.95"/>
    <!-- roof cap of the deck -->
    <path d="M540 172 Q560 156 580 172 Z" fill="#1A1E38" opacity="0.95"/>

    <!-- antenna spire: long, very thin, tapering -->
    <rect x="557.5" y="120" width="5" height="52" fill="#1A1E38" opacity="0.95"/>
    <rect x="558.5" y="92" width="3" height="28" fill="#1A1E38" opacity="0.95"/>
    <rect x="559.4" y="70" width="1.4" height="22" fill="#1A1E38" opacity="0.95"/>

    <!-- deck windows glow up (row of lights on the donut) -->
    <rect x="541" y="184" width="4" height="8" rx="1" fill="#FFD9A0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/></rect>
    <rect x="548" y="184" width="4" height="8" rx="1" fill="#FFC48A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/></rect>
    <rect x="555" y="184" width="4" height="8" rx="1" fill="#FFD9A0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/></rect>
    <rect x="562" y="184" width="4" height="8" rx="1" fill="#FFC48A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/></rect>
    <rect x="569" y="184" width="4" height="8" rx="1" fill="#FFD9A0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.6s" fill="freeze"/></rect>
    <rect x="576" y="184" width="4" height="8" rx="1" fill="#FFC48A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/></rect>

    <!-- blinking red aircraft light at the very tip -->
    <circle cx="560" cy="68" r="2.2" fill="#FF5D6C"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></circle>

    <!-- twinkling fairy lights along the mountain -->
    <circle cx="510" cy="212" r="2.4" fill="#FFD9A0"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="206" r="2.4" fill="#FFD6E8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="230" r="2.2" fill="#CDE6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="652" cy="218" r="2.4" fill="#FFD9A0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>
  </svg>
