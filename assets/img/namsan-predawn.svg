<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — PRE-DAWN (03-06): dark top, warm first light at the horizon -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1230"/>
      <stop offset="0.3" stop-color="#1E2148"/>
      <stop offset="0.46" stop-color="#4A3A68"/>
      <stop offset="0.56" stop-color="#A65E6E"/>
      <stop offset="0.66" stop-color="#F2906E"/>
      <stop offset="0.8" stop-color="#FFB48F"/>
      <stop offset="1" stop-color="#FFC9A8"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- dim moon low -->
  <circle cx="700" cy="80" r="15" fill="#E8E4F8" opacity="0.8"/>
  <circle cx="706" cy="75" r="13" fill="#1E2040" opacity="0.5"/>

  <!-- fading stars -->
  <g fill="#FFFFFF">
    <circle cx="100" cy="60" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="90" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="45" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="75" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- faint pre-dawn band high above the horizon (visible on the sky) -->
  <ellipse cx="560" cy="225" rx="420" ry="60" fill="#FFB48F" opacity="0">
    <animate attributeName="opacity" values="0;0.22;0.34;0.22" dur="7s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="560" cy="220" rx="300" ry="36" fill="#FFD9A0" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0.45;0.3" dur="7s" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1" repeatCount="indefinite"/>
  </ellipse>

  <!-- thin morning mist -->
  <g fill="#FFFFFF" opacity="0.1">
    <ellipse cx="250" cy="240" rx="230" ry="10"/>
    <ellipse cx="650" cy="252" rx="240" ry="9"/>
  </g>

  <!-- far hills -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#1E2040" opacity="0.9"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#161838" opacity="0.95"/>

  <!-- trees -->
  <g fill="#111331">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- city windows: some off now, rest dim -->
  <g fill="#FFC98A">
    <rect x="140" y="262" width="4" height="5" rx="1" opacity="0.5"/>
    <rect x="176" y="258" width="4" height="5" rx="1" opacity="0.6"/>
    <rect x="215" y="264" width="4" height="5" rx="1" opacity="0.4"/>
    <rect x="255" y="266" width="4" height="5" rx="1" opacity="0.55"/>
    <rect x="700" y="272" width="4" height="5" rx="1" opacity="0.4"/>
    <rect x="720" y="260" width="4" height="5" rx="1" opacity="0.5"/>
    <rect x="742" y="270" width="4" height="5" rx="1" opacity="0.3"/>
    <rect x="300" y="280" width="4" height="5" rx="1" opacity="0.45"/>
    <rect x="560" y="280" width="4" height="5" rx="1" opacity="0.5"/>
    <rect x="420" y="284" width="4" height="5" rx="1" opacity="0.35"/>
    <rect x="520" y="284" width="4" height="5" rx="1" opacity="0.3"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- N Seoul Tower dim -->
  <g>
    <path d="M548 262 L560 232 L572 262Z" fill="#0E102C"/>
    <rect x="540" y="220" width="40" height="14" rx="6" fill="#161838" opacity="0.8"/>
    <rect x="552" y="208" width="16" height="12" rx="3" fill="#161838"/>
    <path d="M552 208 L560 172 L568 208Z" fill="#0E102C"/>
    <line x1="560" y1="172" x2="560" y2="140" stroke="#0E102C" stroke-width="3" stroke-linecap="round"/>
    <rect x="543" y="222" width="5" height="9" rx="1.5" fill="#FFD98A" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="551" y="222" width="5" height="9" rx="1.5" fill="#FFC98A" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2s" begin="0.7s" repeatCount="indefinite"/></rect>
    <rect x="559" y="222" width="5" height="9" rx="1.5" fill="#FFD98A" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></rect>
    <rect x="567" y="222" width="5" height="9" rx="1.5" fill="#FFC98A" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></rect>
    <circle cx="560" cy="139" r="2.4" fill="#FFB3C1"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- early bird -->
  <g stroke="#8E84B8" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.45">
    <path d="M300 200 q7 -5 14 0 q7 -5 14 0">
      <animateMotion dur="30s" repeatCount="indefinite" path="M0,0 C60,-26 120,-26 200,-2 C-40,-16 -120,-10 -260,6"/>
    </path>
  </g>

  <!-- dawn light washing over the ridge — always visible so the scene reads 'pre-dawn' -->
  <g opacity="0.5">
    <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#FFC98A" opacity="0.55"/>
    <path d="M520 276C545 272 556 268 560 262C564 268 578 272 610 276 L610 256 C578 254 556 254 560 248 C564 254 578 254 610 256 Z" fill="#FFD9A0" opacity="0.6"/>
    <path d="M0 250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340H0Z" fill="#FFB48F" opacity="0.28"/>
  </g>
  <!-- gentle breathing of the dawn light -->
  <ellipse cx="560" cy="262" rx="330" ry="40" fill="#FFC98A" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.3;0.18" dur="6s" repeatCount="indefinite"/>
  </ellipse>
</svg>
