<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" preserveAspectRatio="xMidYMid slice">
  <!-- Namsan + N Seoul Tower — NIGHT: city lights switch on one by one -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2340"/>
      <stop offset="0.55" stop-color="#2E3866"/>
      <stop offset="0.8" stop-color="#3D4680"/>
      <stop offset="1" stop-color="#4A4E8C"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" fill="url(#sky)"/>

  <!-- moon -->
  <circle cx="150" cy="72" r="20" fill="#F4F0FF"/>
  <circle cx="158" cy="66" r="17" fill="#2E3866" opacity="0.55"/>

  <!-- stars (twinkle) -->
  <g fill="#FFFFFF">
    <circle cx="80" cy="60" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="45" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="80" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="38" r="1.4"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="60" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="42" r="1.6"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="70" r="1.3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.9s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="40" r="1.5"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="130" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="120" r="1.2"><animate attributeName="opacity" values="0.15;1;0.15" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- far hills (dark) -->
  <path d="M0 340V250C70 228 140 240 210 226C290 210 360 238 430 224L520 208C610 192 690 226 780 214C840 206 875 220 900 212V340Z" fill="#232B4D" opacity="0.9"/>
  <!-- Namsan hill -->
  <path d="M0 340V292C90 272 180 288 270 278C360 268 440 286 520 276C545 272 556 268 560 262C564 268 578 272 610 276C700 286 800 272 900 282V340Z" fill="#1A2140" opacity="0.95"/>

  <!-- trees (dark silhouettes) -->
  <g fill="#141A33" opacity="1">
    <path d="M120 284 Q128 258 136 284Z"/><rect x="126.5" y="283" width="3" height="12" rx="1"/>
    <path d="M170 288 Q178 266 186 288Z"/><rect x="176.5" y="287" width="3" height="10" rx="1"/>
    <path d="M250 282 Q257 262 264 282Z"/><rect x="255" y="281" width="3" height="11" rx="1"/>
    <path d="M700 280 Q708 258 716 280Z"/><rect x="706" y="279" width="3" height="12" rx="1"/>
    <path d="M770 284 Q777 266 784 284Z"/><rect x="774" y="283" width="3" height="10" rx="1"/>
    <path d="M640 282 Q647 264 654 282Z"/><rect x="645" y="281" width="3" height="10" rx="1"/>
  </g>

  <!-- city windows on the hillside — they LIGHT UP one by one -->
  <g fill="#FFD98A">
    <rect x="140" y="262" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1s" fill="freeze"/></rect>
    <rect x="158" y="270" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.6s" fill="freeze"/></rect>
    <rect x="176" y="258" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.2s" fill="freeze"/></rect>
    <rect x="196" y="272" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.8s" fill="freeze"/></rect>
    <rect x="215" y="264" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.4s" fill="freeze"/></rect>
    <rect x="235" y="276" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.6s" fill="freeze"/></rect>
    <rect x="255" y="266" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.2s" fill="freeze"/></rect>
    <rect x="680" y="262" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="1.3s" fill="freeze"/></rect>
    <rect x="700" y="272" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2s" fill="freeze"/></rect>
    <rect x="720" y="260" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="2.7s" fill="freeze"/></rect>
    <rect x="742" y="270" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="3.3s" fill="freeze"/></rect>
    <rect x="762" y="280" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="4.1s" fill="freeze"/></rect>
    <rect x="300" y="280" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5s" fill="freeze"/></rect>
    <rect x="420" y="284" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="5.6s" fill="freeze"/></rect>
    <rect x="560" y="280" width="4" height="5" rx="1"><animate attributeName="opacity" values="0;1" dur="0.6s" begin="6.2s" fill="freeze"/></rect>
    <rect x="330" y="276" width="4" height="5" rx="1" opacity="0"><animate attributeName="opacity" values="0;1;0.2;1;0.2" dur="4s" begin="2.5s" repeatCount="indefinite"/></rect>
    <rect x="520" y="284" width="4" height="5" rx="1" opacity="0"><animate attributeName="opacity" values="0;1;0.2;1" dur="3.2s" begin="3.5s" repeatCount="indefinite"/></rect>
    <rect x="380" y="282" width="4" height="5" rx="1" opacity="0"><animate attributeName="opacity" values="0;1;0.25;1;0.25" dur="5s" begin="4.5s" repeatCount="indefinite"/></rect>
  </g>

  <!-- ================= N Seoul Tower — REAL silhouette =================
       Structure: wide concrete podium base → narrow shaft →
       rounded observation deck (donut) → long thin antenna spire -->
  <g>
    <!-- podium base: wide trapezoid sitting on the hill -->
    <path d="M530 258 L590 258 L596 240 L524 240 Z" fill="#0E1330" opacity="0.98"/>
    <!-- shaft: narrow vertical trunk rising from the podium -->
    <rect x="554" y="196" width="12" height="46" fill="#0E1330" opacity="0.98"/>
    <!-- lower maintenance deck (small bump on the shaft) -->
    <rect x="549" y="200" width="22" height="6" rx="2" fill="#131A38" opacity="0.9"/>

    <!-- observation deck: the iconic rounded "donut" — wide ellipse -->
    <ellipse cx="560" cy="190" rx="30" ry="9" fill="#0E1330" opacity="0.98"/>
    <!-- deck upper body (cylindrical) -->
    <rect x="536" y="172" width="48" height="18" rx="8" fill="#0E1330" opacity="0.98"/>
    <!-- roof cap of the deck -->
    <path d="M540 172 Q560 156 580 172 Z" fill="#0E1330" opacity="0.98"/>

    <!-- antenna spire: long, very thin, tapering -->
    <rect x="557.5" y="120" width="5" height="52" fill="#0E1330" opacity="0.98"/>
    <rect x="558.5" y="92" width="3" height="28" fill="#0E1330" opacity="0.98"/>
    <rect x="559.4" y="70" width="1.4" height="22" fill="#0E1330" opacity="0.98"/>

    <!-- deck windows glow up (row of lights on the donut) -->
    <rect x="541" y="184" width="4" height="8" rx="1" fill="#FFE9A8"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/></rect>
    <rect x="548" y="184" width="4" height="8" rx="1" fill="#FFD98A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/></rect>
    <rect x="555" y="184" width="4" height="8" rx="1" fill="#FFE9A8"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.8s" fill="freeze"/></rect>
    <rect x="562" y="184" width="4" height="8" rx="1" fill="#FFD98A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.2s" fill="freeze"/></rect>
    <rect x="569" y="184" width="4" height="8" rx="1" fill="#FFE9A8"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2.6s" fill="freeze"/></rect>
    <rect x="576" y="184" width="4" height="8" rx="1" fill="#FFD98A"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="3s" fill="freeze"/></rect>

    <!-- blinking red aircraft light at the very tip -->
    <circle cx="560" cy="68" r="2.2" fill="#FF5D6C"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.1s" repeatCount="indefinite"/></circle>

    <!-- twinkling fairy lights along the mountain -->
    <circle cx="510" cy="212" r="2.4" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="206" r="2.4" fill="#FFD6E8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="468" cy="230" r="2.2" fill="#CDE6FF"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="652" cy="218" r="2.4" fill="#FFE9A8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- falling star once in a while -->
  <g stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0" dur="7s" begin="3s" repeatCount="indefinite"/>
    <path d="M600 60 l-26 26"/>
  </g>
</svg>
