<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#A78BFA">
<title>Tammy Library · by Camnemi TOPIK</title>
<style>
  :root{
    --bg:#f4f1fb; --card:#ffffff; --ink:#2b2340; --muted:#7a7196;
    --line:#e7e1f5; --accent:#6d4ef0; --accent-soft:#eee8ff; --pink:#e65d9b;
    --amber:#8a5a00; --amber-bg:#fff7e0; --green:#1f8a5b; --green-bg:#e7f6ee;
    --chip-bg:#f0ecfa; --shadow:0 2px 14px rgba(90,70,180,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}

  header{display:flex;align-items:center;gap:14px;padding:8px 2px 4px}
  .logo{width:44px;height:44px;border-radius:13px;flex:none;
    background:linear-gradient(135deg,#6d4ef0,#e65d9b);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;box-shadow:var(--shadow)}
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.3px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:600}

  .stats{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 13px;
    font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
  .stat b{color:var(--ink);font-size:15px;margin-right:3px}

  .search{width:100%;margin:14px 0 10px;padding:12px 15px;border:1.5px solid var(--line);
    border-radius:13px;font-size:14px;background:var(--card);color:var(--ink);outline:none;transition:.15s}
  .search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .tab{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);
    font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;transition:.15s}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab small{opacity:.7;font-weight:600}
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pink);margin-right:5px;vertical-align:middle}

  .series-h{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
  .series-h .bar{flex:1;height:1px;background:var(--line)}
  .series-h h2{font-size:15px;margin:0;color:var(--accent);letter-spacing:-.2px}
  .series-h h2 small{color:var(--muted);font-weight:600;font-size:11.5px;margin-left:6px}

  .grid{display:grid;grid-template-columns:1fr;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:.15s}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card .top{display:flex;align-items:flex-start;gap:10px}
  .badge{flex:none;min-width:40px;text-align:center;font-weight:800;font-size:14px;color:#fff;
    background:var(--accent);border-radius:9px;padding:6px 7px;line-height:1.05}
  .card.elem .badge{background:linear-gradient(135deg,#6d4ef0,#8b5cf6)}
  .card.inter .badge{background:linear-gradient(135deg,#e65d9b,#f472b6)}
  .card.extra .badge{background:linear-gradient(135deg,#3fa37f,#34b98a)}
  .card .ttl{font-size:14.5px;font-weight:700;line-height:1.35;color:var(--ink)}
  .card .ttl .num{color:var(--accent);margin-right:4px}
  .card .book{font-size:11px;font-weight:800;color:var(--accent);background:var(--accent-soft);
    border-radius:7px;padding:2px 8px;flex:none;align-self:flex-start}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11.5px;font-weight:600;background:var(--chip-bg);color:var(--ink);
    border-radius:7px;padding:3px 9px}
  .chip.chapter{color:var(--amber);background:var(--amber-bg)}
  .chip.grammar{color:var(--green);background:var(--green-bg)}
  .foot{display:flex;align-items:center;gap:9px;margin-top:2px}
  .btn{flex:1;text-align:center;text-decoration:none;font-size:12.5px;font-weight:700;
    padding:9px 10px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent);
    transition:.15s;background:#fff}
  .btn.vid{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:hover{opacity:.88}
  .btn .ic{font-size:13px;margin-right:4px}

  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
  footer{margin-top:30px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.7}
  footer a{color:var(--accent);text-decoration:none;font-weight:600}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎬</div>
    <div class="brand">
      <h1>Tammy Library</h1>
      <p>Tammy Korean · 학습-korean.com 강좌 전체 분류</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <input class="search" id="q" type="search" placeholder="🔍 검색 · 문법 포인트 (예: -거든요, 은/는, -았/었을 텐데)…" autocomplete="off">
  <div class="tabs" id="tabs"></div>

  <div id="content"></div>

  <footer>
    자료 출처: <a href="https://learning-korean.com/" target="_blank" rel="noopener">Tammy Korean (learning-korean.com)</a>
    — 무료 유튜브 강의 + 영·한 대본.<br>각 카드의 <b>▶ 영상</b>은 유튜브, <b>대본</b>은 강의 페이지를 엽니다. · by Camnemi TOPIK
  </footer>
</div>

<script src="data/tammy-library.js"></script>
<script>
(function(){
  const LIB = window.TAMMY_LIBRARY;
  const items = LIB.items;

  const CAT_META = {
    elementary:   {label:'초급', series:'elementary', icon:'🌱', order:0},
    intermediate: {label:'중급', series:'intermediate', icon:'🚀', order:1},
    study:        {label:'학습법', series:'study', icon:'📚', order:2},
    korean:       {label:'발음·표현', series:'korean', icon:'🗣️', order:3},
    blog:         {label:'코칭·성공담', series:'blog', icon:'🏆', order:4},
    uncat:        {label:'TOPIK 정보', series:'uncat', icon:'📌', order:5}
  };
  const SERIES_ORDER = ['elementary','intermediate','study','korean','blog','uncat'];

  const state = { tab:'all', q:'' };

  function fmtGrammar(g){
    // strip trailing descriptive subtitle noise
    const stop = ['with english translation','pronunciation and writing','basic alphabet letters','combined vowels','final consonants','how to type','english translation'];
    let out = [];
    for (const x of g){
      const low = x.toLowerCase();
      if (stop.some(s=>low.includes(s))) continue;
      if (!low.includes('greetings')) out.push(x);
    }
    return out;
  }

  function card(i){
    const isLesson = i.kind==='lesson' && i.num != null;
    const bCls = i.cat==='elementary'?'elem':(i.cat==='intermediate'?'inter':'extra');
    const g = fmtGrammar(i.grammar).slice(0,4);
    const numTag = isLesson ? ('# '+i.num) : (i.kind==='quiz'?'QZ':(i.kind==='orient'?'▶':(i.kind==='final'?'🏁':'★')));
    const numLabel = i.num!=null && isLesson ? String(i.num) : numTag;
    const title = i.title.replace(/^\[[^\]]*\]\s*/,'').trim();
    let chips = '';
    if (i.chapter && isLesson) chips += '<span class="chip chapter">'+i.chapter+'</span>';
    g.forEach(x=>{ if(x) chips += '<span class="chip grammar">'+esc(x)+'</span>'; });
    return '<a class="card '+bCls+'" href="'+i.url+'" target="_blank" rel="noopener">'
      + '<div class="top">'
      +   '<span class="badge">'+esc(numLabel)+'</span>'
      +   '<span class="ttl">'+esc(title)+'</span>'
      +   (i.book? '<span class="book">'+i.book+'</span>':'')
      + '</div>'
      + (chips? '<div class="chips">'+chips+'</div>':'')
      + '<div class="foot">'
      +   '<span class="btn vid"><span class="ic">▶</span>영상</span>'
      +   '<span class="btn"><span class="ic">📄</span>대본</span>'
      + '</div>'
      + '</a>';
  }

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function groupAndRender(){
    let list = items.slice();
    if (state.tab!=='all') list = list.filter(i=>i.cat===state.tab);
    const q = state.q.trim().toLowerCase();
    if (q){
      list = list.filter(i=>
        i.title.toLowerCase().includes(q) ||
        (i.grammar||[]).some(g=>String(g).toLowerCase().includes(q)) ||
        String(i.book||'').toLowerCase().includes(q) ||
        String(i.chapter||'').toLowerCase().includes(q)
      );
    }

    // order lessons by number within each cat
    const groups = {};
    for (const i of list){
      (groups[i.cat] = groups[i.cat]||[]).push(i);
    }
    for (const k in groups){
      groups[k].sort((a,b)=>{
        const an=a.num==null?99999:a.num, bn=b.num==null?99999:b.num;
        if (an!==bn) return an-bn;
        return a.id.localeCompare(b.id);
      });
    }

    let html='';
    for (const cat of SERIES_ORDER){
      const arr = groups[cat];
      if (!arr || !arr.length) continue;
      const meta = CAT_META[cat];
      html += '<div class="series-h"><h2>'+meta.icon+' '+meta.label+' <small>'+LIB.series[cat]+'</small></h2><div class="bar"></div></div>';
      html += '<div class="grid">'+arr.map(card).join('')+'</div>';
    }
    if (!html) html = '<div class="empty">검색 결과가 없습니다.</div>';
    document.getElementById('content').innerHTML = html;
  }

  function renderTabs(){
    const counts = {all:items.length};
    for (const cat of SERIES_ORDER) counts[cat] = items.filter(i=>i.cat===cat).length;
    let html = '<button class="tab'+(state.tab==='all'?' active':'')+'" data-t="all">전체 <small>'+counts.all+'</small></button>';
    for (const cat of SERIES_ORDER){
      html += '<button class="tab'+(state.tab===cat?' active':'')+'" data-t="'+cat+'">'+CAT_META[cat].icon+' '+CAT_META[cat].label+' <small>'+counts[cat]+'</small></button>';
    }
    document.getElementById('tabs').innerHTML = html;
    document.querySelectorAll('#tabs .tab').forEach(b=>{
      b.onclick = ()=>{ state.tab=b.dataset.t; renderTabs(); groupAndRender(); };
    });
  }

  function renderStats(){
    const elem = items.filter(i=>i.cat==='elementary').length;
    const inter = items.filter(i=>i.cat==='intermediate').length;
    const lessons = items.filter(i=>i.kind==='lesson').length;
    const quizzes = items.filter(i=>i.kind==='quiz').length;
    document.getElementById('stats').innerHTML =
      '<span class="stat"><b>'+lessons+'</b>강좌</span>'
      +'<span class="stat">🌱 초급 <b>'+elem+'</b></span>'
      +'<span class="stat">🚀 중급 <b>'+inter+'</b></span>'
      +'<span class="stat">📝 퀴즈 <b>'+quizzes+'</b></span>'
      +'<span class="stat">📼 영상+대본 <b>전부</b></span>';
  }

  document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; groupAndRender(); });

  renderStats(); renderTabs(); groupAndRender();
})();
</script>
</body>
</html>
