# Render blueprint — Camnemi TOPIK AI backend
# Creates a Web Service running ai_server.py (serves the app + AI + TTS from one origin)
services:
  - type: web
    name: camnemi-topik-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn ai_server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: CAMNEMI_APP_ROOT
        value: /opt/render/project/src
      - key: NOUS_MODEL
        value: deepseek/deepseek-v4-pro
      # Set NOUS_API_KEY in the Render dashboard (secrets) — NOT committed here
      - key: PYTHON_VERSION
        value: 3.11.0
